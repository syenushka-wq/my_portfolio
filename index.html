<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>Himadi Yenushka De Silva | Software Engineering Portfolio</title>
    <meta name="description" content="Personal portfolio of Himadi Yenushka De Silva, Software Engineering student at IJSE specializing in Java, Spring Boot, React, Python, and AI/Machine Learning." />
    <meta name="keywords" content="Himadi Yenushka De Silva, Himadi De Silva, Software Engineer, IJSE, Full Stack Developer, Java, Spring Boot, React, Python, Machine Learning, Sri Lanka" />
    <meta name="author" content="Himadi Yenushka De Silva" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Himadi Yenushka De Silva | Software Engineering Portfolio" />
    <meta property="og:description" content="Explore my projects, tech stack, and experience in software engineering, cloud systems, and machine learning." />
    <meta property="og:type" content="website" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#08090a" />

    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <style>
      body { background: #08090a; margin: 0; }
      #loader {
        position: fixed;
        inset: 0;
        background: #08090a;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease-out;
      }
      .loader-ring {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-top-color: #6366f1;
        animation: loader-spin 0.7s linear infinite;
      }
      @keyframes loader-spin { to { transform: rotate(360deg); } }
      #loader.fade-out { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="loader">
      <div class="loader-ring"></div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener("load", () => {
        const loader = document.getElementById("loader");
        if (loader) {
          setTimeout(() => {
            loader.classList.add("fade-out");
            setTimeout(() => loader.remove(), 400);
          }, 150);
        }
      });
    </script>
  </body>
</html>
